name: doubao_input_flutter
description: "豆包输入法（复刻）— clean-room Flutter universal clone. Non-official."
publish_to: 'none'
version: 1.5.2+152

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/pinyin_dict.json
